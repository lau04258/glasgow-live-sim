[project]
name = "glasgow-live-sim"
version = "0.1.0"
description = "Open-data Glasgow live city simulation and wildfire resilience demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.41",
  "psycopg[binary]>=3.2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "httpx>=0.28.1",
  "ruff>=0.12.4",
  "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
